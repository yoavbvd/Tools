<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools — Pentesting Toolkit</title>
<meta name="description" content="A phase-based pentesting and OSCP knowledge base with per-folder views.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha512-xeUh+KxNyTufZOje++oQHstlMQ8/rpyzPuM+gjMFYK3z5ILJGE7l2NvYL+XfliKURMpBIKKp1XoPN/qswlSMFA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
:root{
  --bg:#0a0e14; --panel:#0f1620; --panel2:#131c28; --border:#1e2a38;
  --fg:#c9d4e0; --muted:#6b7d92; --accent:#39d98a; --accent2:#2bc4ff; --danger:#ff6b6b;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
#wrap{display:flex;min-height:100vh}
/* Sidebar */
#sidebar{width:270px;flex:0 0 270px;background:var(--panel);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto}
#brand{padding:18px 16px;border-bottom:1px solid var(--border);font-family:var(--mono)}
#brand .logo{color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.5px}
#brand .sub{color:var(--muted);font-size:11px;margin-top:3px}
#searchbox{padding:10px 12px;border-bottom:1px solid var(--border);position:relative}
#search{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--fg);
  font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none}
#search:focus{border-color:var(--accent)}
#results{position:absolute;left:12px;right:12px;top:48px;z-index:30;max-height:60vh;overflow-y:auto;
  background:var(--panel2);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#results .r{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
  padding:9px 11px;cursor:pointer;color:var(--fg)}
#results .r:last-child{border-bottom:0}
#results .r:hover,#results .r.sel{background:var(--panel)}
#results .r .t{font-size:12.5px;color:var(--accent);font-weight:600}
#results .r .sec{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
#results .r .snip{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
#results .r .snip mark,.md mark{background:rgba(57,217,138,.25);color:#eafff3;border-radius:2px;padding:0 1px}
#results .none{padding:11px;color:var(--muted);font-size:12px}
.md mark.hl{background:rgba(43,196,255,.3)}
nav{padding:8px 0}
nav button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:var(--fg);
  font-family:var(--sans);font-size:13.5px;text-align:left;padding:9px 16px;cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:var(--panel2)}
nav button.active{background:var(--panel2);border-left-color:var(--accent);color:#fff}
nav button .ico{width:20px;text-align:center}
nav button .num{color:var(--muted);font-family:var(--mono);font-size:11px;min-width:18px}
/* Main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
#menuBtn{background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:7px 11px;cursor:pointer;font-size:16px}
#content{padding:28px 34px;max-width:900px;width:100%;margin:0 auto}
/* Subnav (per-folder file tabs) */
#subnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
#subnav a{font-family:var(--mono);font-size:12.5px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:var(--panel);color:var(--muted)}
#subnav a.active{border-color:var(--accent);color:var(--accent);background:var(--panel2)}
/* Home grid */
.hero{border:1px solid var(--border);background:linear-gradient(145deg,var(--panel),var(--bg));border-radius:12px;padding:26px;margin-bottom:26px}
.hero h1{margin:0 0 8px;font-size:24px}
.hero .tag{color:var(--muted);font-family:var(--mono);font-size:13px}
.hero .warn{margin-top:14px;font-size:12.5px;color:var(--danger);border-left:3px solid var(--danger);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ic{font-size:22px}
.card .nm{margin-top:8px;font-weight:600;font-size:14.5px}
.card .num{font-family:var(--mono);color:var(--muted);font-size:11px}
.card .cnt{color:var(--muted);font-size:11.5px;margin-top:4px}
/* Lab Notebook */
.nb h1{font-size:24px;margin:0 0 4px}
.nb .lead{color:var(--muted);font-size:13px;margin-bottom:18px}
.nb .bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:4;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.nb .prog{flex:1;min-width:140px;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
.nb .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.nb .pct{font-family:var(--mono);font-size:12px;color:var(--accent)}
.nb button.act{background:var(--panel2);border:1px solid var(--border);color:var(--fg);font-family:var(--sans);
  font-size:12.5px;padding:7px 13px;border-radius:7px;cursor:pointer}
.nb button.act:hover{border-color:var(--accent)}
.nb button.primary{background:var(--accent);color:#06240f;border-color:var(--accent);font-weight:600}
.nb .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.nb label{display:block;font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.nb input,.nb textarea{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:7px;color:var(--fg);
  font-family:var(--sans);font-size:13px;padding:8px 10px;outline:none}
.nb input:focus,.nb textarea:focus{border-color:var(--accent)}
.nb textarea{resize:vertical;min-height:70px;font-family:var(--mono);font-size:12.5px;line-height:1.5}
.nb .phase{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.nb .phase h3{margin:0 0 10px;font-size:15px}
.nb .phase h3 .c{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.nb .chk{display:flex;align-items:flex-start;gap:9px;padding:5px 0;cursor:pointer;font-size:13.5px}
.nb .chk input{width:auto;margin-top:2px;accent-color:var(--accent);cursor:pointer}
.nb .chk.done span{color:var(--muted);text-decoration:line-through}
.nb .ntitle{font-size:11px;color:var(--muted);font-family:var(--mono);margin:10px 0 4px;text-transform:uppercase}
.nb .save{font-size:11px;color:var(--muted);font-family:var(--mono)}
.nb .save.ok{color:var(--accent)}
/* Rendered markdown */
.md h1{font-size:25px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-top:0}
.md h2{font-size:20px;margin-top:30px;border-bottom:1px solid var(--border);padding-bottom:6px}
.md h3{font-size:16px;margin-top:22px;color:var(--accent)}
.md code{font-family:var(--mono);background:var(--panel2);padding:2px 6px;border-radius:4px;font-size:12.5px;color:#e6cc7a}
.md pre{position:relative;background:#06090d;border:1px solid var(--border);border-radius:8px;padding:14px 14px;overflow-x:auto}
.md pre code{background:none;padding:0;color:#cfe3d4;font-size:12.5px;display:block}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:8px 11px;text-align:left}
.md th{background:var(--panel2);color:var(--accent2)}
.md tr:nth-child(even){background:rgba(255,255,255,.015)}
.md blockquote{border-left:3px solid var(--accent2);background:var(--panel);margin:14px 0;padding:10px 16px;color:var(--muted);border-radius:0 6px 6px 0}
.md ul,.md ol{padding-left:22px}
.md a{border-bottom:1px dotted transparent}
.copybtn{position:absolute;top:8px;right:8px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:5px;cursor:pointer;opacity:0;transition:opacity .15s}
.md pre:hover .copybtn{opacity:1}
.copybtn.ok{color:var(--accent);border-color:var(--accent)}
#scrim{display:none}
@media(max-width:820px){
  #sidebar{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .2s}
  #sidebar.open{transform:translateX(0)}
  #topbar{display:flex}
  #content{padding:18px 16px}
  #scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}
}
</style>
</head>
<body>
<div id="wrap">
  <aside id="sidebar">
    <div id="brand"><div class="logo">▚ TOOLS</div><div class="sub">Pentesting Toolkit</div></div>
    <div id="searchbox">
      <input id="search" type="search" placeholder="Search ( / )  —  tools, flags, commands" autocomplete="off" spellcheck="false">
      <div id="results" hidden></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div id="main">
    <div id="topbar"><button id="menuBtn">☰</button><strong style="font-family:var(--mono);font-size:13px">▚ TOOLS</strong></div>
    <div id="content"></div>
  </div>
</div>
<div id="scrim"></div>
<script>
const SECTIONS = [{"id": "home", "label": "Home", "icon": "🏠", "num": "", "files": []}, {"id": "guides", "label": "Guides", "icon": "📖", "num": "", "files": [{"path": "START-A-PENTEST-LAB.md", "title": "Start a Pentest Lab"}, {"path": "Pentesting-Field-Guide.md", "title": "Pentesting Field Guide"}]}, {"id": "00-Lab-Setup", "label": "Lab Setup", "num": "00", "icon": "🧰", "files": [{"path": "00-Lab-Setup/README.md", "title": "Overview"}]}, {"id": "01-Recon", "label": "Recon", "num": "01", "icon": "🔭", "files": [{"path": "01-Recon/README.md", "title": "Overview"}, {"path": "01-Recon/Internet-Scanners-and-Threat-Intel.md", "title": "Internet Scanners and Threat Intel"}, {"path": "01-Recon/OSINT-Toolkit.md", "title": "OSINT Toolkit"}]}, {"id": "02-Enumeration", "label": "Enumeration", "num": "02", "icon": "📡", "files": [{"path": "02-Enumeration/README.md", "title": "Overview"}, {"path": "02-Enumeration/FTP.md", "title": "FTP"}, {"path": "02-Enumeration/LDAP.md", "title": "LDAP"}, {"path": "02-Enumeration/SMB.md", "title": "SMB"}, {"path": "02-Enumeration/SNMP.md", "title": "SNMP"}, {"path": "02-Enumeration/SSH.md", "title": "SSH"}]}, {"id": "03-Web", "label": "Web", "num": "03", "icon": "🌐", "files": [{"path": "03-Web/README.md", "title": "Overview"}, {"path": "03-Web/Client-Side-JavaScript-Security.md", "title": "Client Side JavaScript Security"}]}, {"id": "04-Exploitation", "label": "Exploitation", "num": "04", "icon": "💥", "files": [{"path": "04-Exploitation/README.md", "title": "Overview"}, {"path": "04-Exploitation/Reverse-Shells.md", "title": "Reverse Shells"}]}, {"id": "05-Privilege-Escalation", "label": "Privilege Escalation", "num": "05", "icon": "🔼", "files": [{"path": "05-Privilege-Escalation/README.md", "title": "Overview"}, {"path": "05-Privilege-Escalation/Linux.md", "title": "Linux"}, {"path": "05-Privilege-Escalation/Windows.md", "title": "Windows"}]}, {"id": "06-Active-Directory", "label": "Active Directory", "num": "06", "icon": "🏛️", "files": [{"path": "06-Active-Directory/README.md", "title": "Overview"}, {"path": "06-Active-Directory/Windows-Server-AD-Lab-Setup.md", "title": "Windows Server AD Lab Setup"}]}, {"id": "07-Post-Exploitation-Pivoting", "label": "Post Exploitation Pivoting", "num": "07", "icon": "🔀", "files": [{"path": "07-Post-Exploitation-Pivoting/README.md", "title": "Overview"}]}, {"id": "08-Password-Attacks", "label": "Password Attacks", "num": "08", "icon": "🔑", "files": [{"path": "08-Password-Attacks/README.md", "title": "Overview"}]}, {"id": "09-Reporting", "label": "Reporting", "num": "09", "icon": "📝", "files": [{"path": "09-Reporting/README.md", "title": "Overview"}]}, {"id": "10-Analysis-Forensics", "label": "Analysis Forensics", "num": "10", "icon": "🔬", "files": [{"path": "10-Analysis-Forensics/README.md", "title": "Overview"}, {"path": "10-Analysis-Forensics/Crypto-and-Encoding.md", "title": "Crypto and Encoding"}, {"path": "10-Analysis-Forensics/OLEdump.md", "title": "OLEdump"}]}, {"id": "OSCP", "label": "OSCP", "num": "", "icon": "🎓", "files": [{"path": "OSCP/README.md", "title": "Overview"}, {"path": "OSCP/Cheat-Sheet.md", "title": "Cheat Sheet"}, {"path": "OSCP/Exam-Format.md", "title": "Exam Format"}, {"path": "OSCP/Methodology.md", "title": "Methodology"}, {"path": "OSCP/Practice-Resources.md", "title": "Practice Resources"}, {"path": "OSCP/Report-Tips.md", "title": "Report Tips"}, {"path": "OSCP/Restricted-Tools.md", "title": "Restricted Tools"}]}, {"id": "Misc", "label": "Misc", "num": "", "icon": "🧩", "files": [{"path": "Misc/README.md", "title": "Overview"}, {"path": "Misc/AI-Assisted-Pentesting-and-Adversary-Emulation.md", "title": "AI Assisted Pentesting and Adversary Emulation"}]}];
const nav=document.getElementById('nav'), content=document.getElementById('content'),
      sidebar=document.getElementById('sidebar'), scrim=document.getElementById('scrim');

marked.setOptions({gfm:true,breaks:false});

function buildNav(){
  SECTIONS.forEach((s,i)=>{
    const b=document.createElement('button'); b.dataset.id=s.id;
    b.innerHTML=`<span class="ico">${s.icon}</span><span class="num">${s.num||''}</span><span>${s.label}</span>`;
    b.onclick=()=>{location.hash='#/'+s.id; closeMenu();};
    nav.appendChild(b);
    // Lab Notebook button goes right after "Guides"
    if(s.id==='guides'){
      const nb=document.createElement('button'); nb.dataset.id='notebook';
      nb.innerHTML=`<span class="ico">📓</span><span class="num"></span><span>Lab Notebook</span>`;
      nb.onclick=()=>{location.hash='#/notebook'; closeMenu();};
      nav.appendChild(nb);
    }
  });
}
function setActive(id){[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.id===id));}
function closeMenu(){sidebar.classList.remove('open');scrim.classList.remove('show');}

function resolvePath(base, link){
  // base = file path like "06-Active-Directory/README.md"; link may be ../OSCP/x.md or Foo.md or dir/
  const dir = base.includes('/') ? base.slice(0,base.lastIndexOf('/')) : '';
  let parts=(dir?dir.split('/'):[]).concat(link.split('/'));
  const out=[];
  for(const p of parts){ if(p===''||p==='.')continue; if(p==='..')out.pop(); else out.push(p); }
  return out.join('/');
}
function findSectionByPath(p){
  p=p.replace(/\/$/,'');
  for(const s of SECTIONS){ if(s.id===p) return {s,file:s.files[0]};
    for(const f of s.files){ if(f.path===p||f.path.replace(/\.md$/,'')===p) return {s,file:f}; } }
  // directory link -> section whose first file folder matches
  for(const s of SECTIONS){ if(s.files[0] && s.files[0].path.startsWith(p+'/')) return {s,file:s.files[0]}; }
  return null;
}

function slugify(s){ return s.toLowerCase().replace(/[^\p{L}\p{N}\p{M}\s-]/gu,'').trim().replace(/\s/g,'-'); }
function addHeadingIds(root){
  const seen={};
  root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{
    let base=slugify(h.textContent)||'section', id=base, i=1;
    while(seen[id]) id=base+'-'+(i++);
    seen[id]=1; h.id=id;
  });
}
function scrollToAnchor(root,id){
  let el=document.getElementById(id);
  if(!el){ el=[...root.querySelectorAll('h1,h2,h3,h4,h5,h6')].find(h=>slugify(h.textContent)===id||slugify(h.textContent).replace(/^-+/,'')===id.replace(/^-+/,'')); }
  if(el){ el.scrollIntoView({block:'start',behavior:'smooth'}); return true; }
  return false;
}

async function render(){
  const h=location.hash||'';
  // Bare in-page anchor (#foo), not a route (#/foo): scroll within the current page.
  if(h && h.length>1 && !h.startsWith('#/')){
    const id=decodeURIComponent(h.slice(1));
    const md=content.querySelector('.md');
    if(md && scrollToAnchor(md,id)) return;
    setActive('home'); return renderHome();
  }
  const raw=decodeURIComponent(h.replace(/^#\//,'')) || 'home';
  if(raw==='home'||raw===''){ setActive('home'); return renderHome(); }
  if(raw==='notebook'){ setActive('notebook'); return renderNotebook(); }
  // raw may be a section id OR a file path
  let sec=SECTIONS.find(s=>s.id===raw);
  let file=null;
  if(sec){ file=sec.files[0]; }
  else { const hit=findSectionByPath(raw); if(hit){sec=hit.s;file=hit.file;} }
  if(!sec){ content.innerHTML='<p>Not found.</p>'; return; }
  setActive(sec.id);
  if(!file){ // section with no files (shouldn't happen except home)
    content.innerHTML='<h1>'+sec.label+'</h1>'; return; }
  await renderFile(sec,file);
}

function renderHome(){
  let cards=SECTIONS.filter(s=>s.id!=='home'&&s.id!=='guides').map(s=>
    `<div class="card" onclick="location.hash='#/${s.id}'">
        <div class="ic">${s.icon}</div>
        <div class="num">${s.num?('PHASE '+s.num):''}</div>
        <div class="nm">${s.label}</div>
        <div class="cnt">${s.files.length} page${s.files.length>1?'s':''}</div>
     </div>`).join('');
  content.innerHTML=`
   <div class="hero">
     <h1>🛡️ Pentesting Toolkit</h1>
     <div class="tag">Phase-by-phase offensive-security tools, commands, and cheat sheets.</div>
     <div style="margin-top:14px">
       <a href="#/guides">📖 Start a Pentest Lab</a> &nbsp;·&nbsp;
       <a href="#/notebook">📓 Lab Notebook</a> &nbsp;·&nbsp;
       <a href="#/10-Analysis-Forensics">🔬 Analysis & Forensics</a>
     </div>
     <div class="warn">For educational purposes only, and only for lab-controlled, authorized penetration testing.</div>
   </div>
   <div class="grid">${cards}</div>`;
}

async function renderFile(sec,file){
  // subnav of files in this section
  let sub = sec.files.length>1 ? '<div id="subnav">'+sec.files.map(f=>
     `<a href="#/${encodeURIComponent(f.path)}" class="${f.path===file.path?'active':''}">${f.title}</a>`).join('')+'</div>' : '';
  content.innerHTML=sub+'<div class="md">Loading…</div>';
  const mdEl=content.querySelector('.md');
  try{
    const res=await fetch(file.path,{cache:'no-cache'});
    if(!res.ok) throw new Error(res.status);
    const text=await res.text();
    mdEl.innerHTML=marked.parse(text);
    addHeadingIds(mdEl);
    rewriteLinks(mdEl,file.path);
    addCopyButtons(mdEl);
    content.scrollIntoView({block:'start'});
    if(pendingHighlight){ const q=pendingHighlight; pendingHighlight=null; applyHighlight(mdEl,q); }
    else { window.scrollTo(0,0); }
  }catch(e){
    mdEl.innerHTML='<blockquote>Could not load <code>'+file.path+'</code>. '+
      'If you opened this file directly from disk, the browser blocks local fetch — use GitHub Pages or a local web server.</blockquote>';
  }
}

function rewriteLinks(root,base){
  root.querySelectorAll('a[href]').forEach(a=>{
    const href=a.getAttribute('href');
    // In-page anchor (#heading, not a #/route): smooth-scroll without changing the route.
    if(href.startsWith('#') && !href.startsWith('#/')){
      a.addEventListener('click',e=>{ e.preventDefault(); scrollToAnchor(root, decodeURIComponent(href.slice(1))); });
      return;
    }
    if(/^(https?:|mailto:|#)/.test(href)) return;
    // internal .md or folder link -> route in-app
    const resolved=resolvePath(base,href.replace(/#.*$/,''));
    const hit=findSectionByPath(resolved);
    if(hit){ a.setAttribute('href','#/'+encodeURIComponent(hit.file.path)); }
  });
}

function addCopyButtons(root){
  root.querySelectorAll('pre').forEach(pre=>{
    const btn=document.createElement('button'); btn.className='copybtn'; btn.textContent='copy';
    btn.onclick=()=>{ const code=pre.querySelector('code')||pre;
      navigator.clipboard.writeText(code.innerText).then(()=>{ btn.textContent='copied'; btn.classList.add('ok');
        setTimeout(()=>{btn.textContent='copy';btn.classList.remove('ok');},1200); }); };
    pre.appendChild(btn);
  });
}

document.getElementById('menuBtn').onclick=()=>{sidebar.classList.add('open');scrim.classList.add('show');};
scrim.onclick=closeMenu;
// ---------- Search ----------
let pendingHighlight=null, searchIndex=null, indexing=null, selIdx=-1;
const searchEl=document.getElementById('search'), resultsEl=document.getElementById('results');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const htmlEsc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function allFiles(){ const o=[]; SECTIONS.forEach(s=>s.files.forEach(f=>o.push({path:f.path,title:f.title,section:s.label,icon:s.icon}))); return o; }

async function buildIndex(){
  if(searchIndex) return searchIndex;
  if(indexing) return indexing;
  indexing=Promise.all(allFiles().map(async f=>{
    try{ const t=await fetch(f.path,{cache:'force-cache'}).then(r=>r.text()); return {...f,text:t,lc:t.toLowerCase()}; }
    catch(e){ return {...f,text:'',lc:''}; }
  })).then(d=>{ searchIndex=d; return d; });
  return indexing;
}

function snippet(text,lc,q){
  const i=lc.indexOf(q); if(i<0) return '';
  const start=Math.max(0,i-40), end=Math.min(text.length,i+q.length+70);
  let s=htmlEsc(text.slice(start,end).replace(/\s+/g,' ').trim());
  s=s.replace(new RegExp('('+reEsc(q)+')','ig'),'<mark>$1</mark>');
  return (start>0?'… ':'')+s+(end<text.length?' …':'');
}

async function doSearch(raw){
  const q=raw.trim().toLowerCase();
  if(q.length<2){ resultsEl.hidden=true; resultsEl.innerHTML=''; return; }
  const docs=await buildIndex();
  const hits=[];
  for(const d of docs){
    let score=0; const idx=d.lc.indexOf(q);
    if(d.title.toLowerCase().includes(q)) score+=50;
    if(idx>=0){ score+=20; let c=0,p=idx; while(p>=0&&c<12){c++;p=d.lc.indexOf(q,p+q.length);} score+=c; }
    if(score>0) hits.push({d,score,idx});
  }
  hits.sort((a,b)=>b.score-a.score);
  const top=hits.slice(0,25);
  if(!top.length){ resultsEl.innerHTML='<div class="none">No matches for “'+htmlEsc(raw)+'”.</div>'; resultsEl.hidden=false; return; }
  resultsEl.innerHTML=top.map((h,i)=>{
    const snip=h.idx>=0?snippet(h.d.text,h.d.lc,q):'';
    return '<button class="r'+(i===0?' sel':'')+'" data-path="'+encodeURIComponent(h.d.path)+'" data-q="'+encodeURIComponent(q)+'">'+
      '<div class="t">'+h.d.icon+' '+htmlEsc(h.d.title)+'</div><div class="sec">'+htmlEsc(h.d.section)+'</div>'+
      (snip?'<div class="snip">'+snip+'</div>':'')+'</button>';
  }).join('');
  selIdx=0; resultsEl.hidden=false;
  resultsEl.querySelectorAll('.r').forEach(b=>{ b.onclick=()=>{
    pendingHighlight=decodeURIComponent(b.dataset.q);
    location.hash='#/'+b.dataset.path; closeResults(); closeMenu(); }; });
}
function closeResults(){ resultsEl.hidden=true; }

function applyHighlight(root,q){
  if(!q) return;
  const re=new RegExp(reEsc(q),'i'), reg=new RegExp('('+reEsc(q)+')','ig');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const targets=[]; let n;
  while(n=walker.nextNode()){ const pn=n.parentNode; if(pn&&!['SCRIPT','STYLE','MARK'].includes(pn.nodeName)&&re.test(n.nodeValue)) targets.push(n); }
  targets.forEach(t=>{ const span=document.createElement('span');
    span.innerHTML=htmlEsc(t.nodeValue).replace(reg,'<mark class="hl">$1</mark>');
    t.parentNode.replaceChild(span,t); });
  const m=root.querySelector('mark.hl');
  if(m) m.scrollIntoView({block:'center'}); else window.scrollTo(0,0);
}

let searchTimer;
searchEl.addEventListener('input',()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(()=>doSearch(searchEl.value),110); });
searchEl.addEventListener('focus',()=>{ buildIndex(); if(searchEl.value.trim().length>=2) doSearch(searchEl.value); });
searchEl.addEventListener('keydown',e=>{
  const items=[...resultsEl.querySelectorAll('.r')];
  if(e.key==='Escape'){ searchEl.value=''; closeResults(); searchEl.blur(); return; }
  if(!items.length) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); selIdx=Math.min(items.length-1,selIdx+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); selIdx=Math.max(0,selIdx-1); }
  else if(e.key==='Enter'){ e.preventDefault(); if(items[selIdx]) items[selIdx].click(); return; }
  else return;
  items.forEach((b,i)=>b.classList.toggle('sel',i===selIdx)); items[selIdx].scrollIntoView({block:'nearest'});
});
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==searchEl&&!/^(INPUT|TEXTAREA)$/.test(document.activeElement.nodeName)){ e.preventDefault(); searchEl.focus(); } });
document.addEventListener('click',e=>{ if(!document.getElementById('searchbox').contains(e.target)) closeResults(); });

// ---------- Lab Notebook ----------
const LAB_KEY='tools_lab_notebook_v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAB_PHASES=[
 {id:'setup',icon:'🧰',name:'00 · Lab Setup',items:['Attack VM updated & snapshotted','VPN connected, routing confirmed','Engagement folder created','Target scope & rules of engagement recorded']},
 {id:'recon',icon:'🔭',name:'01 · Recon',items:['Full TCP port scan (all ports)','UDP top-ports scan','Service versions identified','Subdomains / vhosts enumerated','Hostnames added to /etc/hosts']},
 {id:'enum',icon:'📡',name:'02 · Enumeration',items:['Each open service enumerated in depth','SMB shares / null session checked','Default & weak credentials tried','Interesting files / versions noted']},
 {id:'web',icon:'🌐',name:'03 · Web',items:['Directories & files fuzzed','Parameters tested (SQLi, LFI, cmd inj)','Auth / session logic reviewed','File upload / SSRF / IDOR checked']},
 {id:'foothold',icon:'💥',name:'04 · Exploitation / Foothold',items:['Public exploits matched to versions','Reverse shell caught','Shell stabilized (PTY)','Initial access documented + screenshot']},
 {id:'privesc',icon:'🔼',name:'05 · Privilege Escalation',items:['Automated enum run (linpeas / winpeas)','SUID / sudo / services reviewed','Kernel / OS exploit checked','Escalated to root / SYSTEM','proof.txt captured + screenshot']},
 {id:'ad',icon:'🏛️',name:'06 · Active Directory',items:['Domain mapped (BloodHound)','Kerberoast / AS-REP attempted','Lateral movement path found','Domain Admin reached']},
 {id:'pivot',icon:'🔀',name:'07 · Post-Exploitation / Pivoting',items:['Credentials & secrets looted','Internal subnets reached (tunnel)','Persistence considered (if in scope)']},
 {id:'creds',icon:'🔑',name:'08 · Password Attacks',items:['Hashes identified','Offline cracking run (hashcat / john)','Cracked credentials reused']},
 {id:'report',icon:'📝',name:'09 · Reporting',items:['All evidence / screenshots saved','Findings written (severity + impact + recommendation)','Report drafted','Report reviewed']},
];
function loadLab(){ try{ const s=localStorage.getItem(LAB_KEY); if(s) return JSON.parse(s); }catch(e){} return {meta:{},checks:{},notes:{},summary:''}; }
let lab=loadLab(); let labSaveTimer;
function saveLab(){ try{ localStorage.setItem(LAB_KEY,JSON.stringify(lab)); }catch(e){} flashSave('saved'); }
function flashSave(msg){ const el=document.getElementById('nbsave'); if(!el)return; el.textContent='✓ '+msg; el.classList.add('ok'); clearTimeout(labSaveTimer); labSaveTimer=setTimeout(()=>{el.textContent='';el.classList.remove('ok');},1300); }
function labCounts(){ let total=0,done=0; LAB_PHASES.forEach(p=>p.items.forEach((_,i)=>{ total++; if(lab.checks[p.id+':'+i]) done++; })); return {total,done}; }
function updateProgress(){ const {total,done}=labCounts(); const pct=total?Math.round(done/total*100):0;
  const bar=document.getElementById('nbprog'), pc=document.getElementById('nbpct'); if(bar)bar.style.width=pct+'%'; if(pc)pc.textContent=done+'/'+total+' · '+pct+'%'; }
function labFilename(ext){ const t=(lab.meta.target||'lab').replace(/[^\w-]+/g,'_').slice(0,40)||'lab'; return `pentest-${t}-${new Date().toISOString().slice(0,10)}.${ext}`; }

function labMarkdown(){
  const m=lab.meta, {total,done}=labCounts(), d=new Date().toISOString().slice(0,10);
  let o=`# Pentest Lab Report — ${m.target||'Untitled Engagement'}\n\n`;
  o+=`| Field | Value |\n| --- | --- |\n| Target | ${m.target||''} |\n| IP(s) | ${m.ip||''} |\n| Scope | ${m.scope||''} |\n| Date | ${m.date||''} |\n| Tester | ${m.tester||''} |\n| Progress | ${done}/${total} checks complete |\n\n`;
  if((lab.summary||'').trim()) o+=`## Executive Summary\n\n${lab.summary.trim()}\n\n`;
  LAB_PHASES.forEach(p=>{
    o+=`## ${p.name}\n\n`;
    p.items.forEach((it,i)=>{ o+=`- [${lab.checks[p.id+':'+i]?'x':' '}] ${it}\n`; });
    const n=(lab.notes[p.id]||'').trim(); if(n) o+=`\n**Notes:**\n\n${n}\n`;
    o+=`\n`;
  });
  o+=`---\n\n_Generated with the Pentesting Toolkit lab notebook on ${d}. For authorized testing only._\n`;
  return o;
}
function labHtml(){
  const body=marked.parse(labMarkdown());
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(lab.meta.target||'Pentest Lab Report')}</title>
<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:820px;margin:40px auto;padding:0 20px;color:#1a1a1a;line-height:1.6}
code,pre{font-family:ui-monospace,Consolas,monospace}pre{background:#f4f4f4;padding:12px;border-radius:6px;overflow:auto}
table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:6px 10px;text-align:left}h1,h2{border-bottom:1px solid #eee;padding-bottom:4px}
ul{list-style:none;padding-left:4px}li{margin:3px 0}</style></head><body>${body}</body></html>`;
}
function download(name,text,type){
  const b=new Blob([text],{type:type||'text/plain'}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}

function renderNotebook(){
  const m=lab.meta;
  const phases=LAB_PHASES.map(p=>{
    const items=p.items.map((it,i)=>{ const done=!!lab.checks[p.id+':'+i];
      return `<label class="chk${done?' done':''}" data-k="${p.id}:${i}"><input type="checkbox" ${done?'checked':''}><span>${esc(it)}</span></label>`; }).join('');
    return `<div class="phase"><h3>${p.icon} ${esc(p.name)}</h3>${items}
      <div class="ntitle">Notes</div>
      <textarea data-note="${p.id}" placeholder="Findings, commands, creds, screenshot paths…">${esc(lab.notes[p.id]||'')}</textarea></div>`;
  }).join('');
  content.innerHTML=`<div class="nb">
    <h1>📓 Lab Notebook</h1>
    <div class="lead">Document your lab engagement phase by phase. Everything is saved <strong>in this browser only</strong> — nothing is uploaded. Export a report when you finish. <span class="save" id="nbsave"></span></div>
    <div class="bar">
      <div class="prog"><i id="nbprog"></i></div><span class="pct" id="nbpct">0/0</span>
      <button class="act primary" id="nbmd">⬇ Markdown</button>
      <button class="act" id="nbhtml">⬇ HTML</button>
      <button class="act" id="nbcopy">⧉ Copy</button>
      <button class="act" id="nbreset">↺ Reset</button>
    </div>
    <div class="meta">
      <div><label>Target / name</label><input data-meta="target" value="${esc(m.target)}" placeholder="box01 / client-a"></div>
      <div><label>IP(s)</label><input data-meta="ip" value="${esc(m.ip)}" placeholder="10.10.10.50"></div>
      <div><label>Date</label><input data-meta="date" value="${esc(m.date)}" placeholder="YYYY-MM-DD"></div>
      <div><label>Tester</label><input data-meta="tester" value="${esc(m.tester)}"></div>
      <div style="grid-column:1/-1"><label>Scope / rules of engagement</label><input data-meta="scope" value="${esc(m.scope)}" placeholder="in-scope hosts, constraints, timing"></div>
    </div>
    <label>Executive summary</label>
    <textarea data-summary style="min-height:90px;margin-bottom:20px" placeholder="One-paragraph summary of the engagement and key outcomes…">${esc(lab.summary)}</textarea>
    ${phases}
    <p class="lead" style="margin-top:18px">Tip: the checklist mirrors the phase folders in the sidebar — open a phase for the tools and commands.</p>
  </div>`;
  window.scrollTo(0,0);
  content.querySelectorAll('[data-meta]').forEach(inp=>inp.addEventListener('input',()=>{ lab.meta[inp.dataset.meta]=inp.value; saveLab(); }));
  const sum=content.querySelector('[data-summary]'); if(sum) sum.addEventListener('input',()=>{ lab.summary=sum.value; saveLab(); });
  content.querySelectorAll('[data-note]').forEach(t=>t.addEventListener('input',()=>{ lab.notes[t.dataset.note]=t.value; saveLab(); }));
  content.querySelectorAll('.chk input[type=checkbox]').forEach(cb=>cb.addEventListener('change',()=>{
    const row=cb.closest('.chk'); lab.checks[row.dataset.k]=cb.checked; row.classList.toggle('done',cb.checked); saveLab(); updateProgress(); }));
  content.querySelector('#nbmd').onclick=()=>download(labFilename('md'),labMarkdown(),'text/markdown');
  content.querySelector('#nbhtml').onclick=()=>download(labFilename('html'),labHtml(),'text/html');
  content.querySelector('#nbcopy').onclick=()=>{ navigator.clipboard.writeText(labMarkdown()).then(()=>flashSave('copied')); };
  content.querySelector('#nbreset').onclick=()=>{ if(confirm('Clear all notebook data saved in this browser?')){ lab={meta:{},checks:{},notes:{},summary:''}; saveLab(); renderNotebook(); } };
  updateProgress();
}

window.addEventListener('hashchange',render);
buildNav(); render(); buildIndex();
</script>
